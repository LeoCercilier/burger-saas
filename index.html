<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger House</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: 0.8;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px 15px 100px;
    }

    h2 {
      margin-top: 10px;
    }

    .produto {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .produto h3 {
      margin: 0 0 7px;
    }

    .descricao {
      color: #666;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .preco {
      font-size: 18px;
      font-weight: bold;
    }

    button {
      background: #111;
      color: white;
      border: 0;
      padding: 10px 15px;
      border-radius: 8px;
      float: right;
      cursor: pointer;
    }

    #mensagem {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>🍔 Burger House</h1>
  <p>Faça seu pedido pelo nosso cardápio</p>
</header>

<main>
  <h2>Nosso cardápio</h2>

  <div id="produtos">
    <div id="mensagem">Carregando produtos...</div>
  </div>
</main>

<script>
  // COLOQUE AQUI A SUA API URL DO SUPABASE
  const SUPABASE_URL = "https://chzatnrzmwgjpyxnfdlt.supabase.co/rest/v1/";

  // COLOQUE AQUI A SUA PUBLISHABLE KEY / ANON KEY
  const SUPABASE_KEY = "sb_publishable_p_5VyliNPeji3YKccxVqUQ_bTt9_YwR";

  async function carregarProdutos() {
    const url =
      SUPABASE_URL +
      "/rest/v1/produtos?select=*&hamburgueria_id=eq.1&ativo=eq.true";

    try {
      const resposta = await fetch(url, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      });

      if (!resposta.ok) {
        throw new Error("Erro ao acessar o banco");
      }

      const produtos = await resposta.json();

      const container = document.getElementById("produtos");

      if (produtos.length === 0) {
        container.innerHTML = "<div id='mensagem'>Nenhum produto disponível.</div>";
        return;
      }

      container.innerHTML = "";

      produtos.forEach(produto => {
        const item = document.createElement("div");
        item.className = "produto";

        item.innerHTML = `
          <h3>${produto.nome}</h3>
          <div class="descricao">${produto.descricao || ""}</div>
          <span class="preco">
            R$ ${Number(produto.preco).toFixed(2).replace(".", ",")}
          </span>
          <button onclick="adicionar('${produto.nome}')">
            + Adicionar
          </button>
        `;

        container.appendChild(item);
      });

    } catch (erro) {
      document.getElementById("produtos").innerHTML =
        "<div id='mensagem'>Não foi possível carregar o cardápio.</div>";

      console.error(erro);
    }
  }

  function adicionar(nome) {
    alert(nome + " foi adicionado ao pedido!");
  }

  carregarProdutos();
</script>

</body>
</html>
